<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 24 24">
  <!--
    Antler 앱 아이콘. 둥근 사각형(토큰 bg-base) 위에 사슴뿔.
    짧은 기둥이 큰 두 갈래로 갈라지고(git 레인), 큰 갈래마다 가는 작은 갈래가 둘씩 붙어 한쪽에 끝이 셋이다.
    작은 갈래는 큰 갈래보다 가늘고(1.2) 끝 노드도 조금 작다.
    가닥 끝은 앰버 노드(커밋). 색: 바탕 #14110F(토큰 bg-base), 뿔 #EDE6D8(text-primary), 노드 #D9A441(accent)
    모든 크기에서 같은 모양을 쓴다: icon-small.svg 는 이 파일과 같고, 툴바 로고(components/brand.tsx)는 바탕 없이 같은 좌표다 — 셋을 함께 고친다.
  -->
  <rect x="0.4" y="0.4" width="23.2" height="23.2" rx="5.4" fill="#14110F"/>
  <g transform="translate(2.4 4.55) scale(0.8)">
    <g fill="none" stroke="#EDE6D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 17V14"/>
      <path d="M12 14C12 10 8 8.5 6.5 3"/>
      <path d="M12 14C12 10 16 8.5 17.5 3"/>
    </g>
    <g fill="none" stroke="#EDE6D8" stroke-width="1.2" stroke-linecap="round">
      <path d="M10.81 10.44L7.21 9.44"/>
      <path d="M13.19 10.44L16.79 9.44"/>
      <path d="M8.35 7.05L4.75 6.05"/>
      <path d="M15.65 7.05L19.25 6.05"/>
    </g>
    <g fill="#D9A441">
      <circle cx="6.29" cy="2.23" r="1.9"/>
      <circle cx="17.71" cy="2.23" r="1.9"/>
      <circle cx="6.45" cy="9.23" r="1.45"/>
      <circle cx="17.55" cy="9.23" r="1.45"/>
      <circle cx="3.98" cy="5.84" r="1.45"/>
      <circle cx="20.02" cy="5.84" r="1.45"/>
    </g>
  </g>
</svg>
