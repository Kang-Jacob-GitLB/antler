name: build

# PR 머지 게이트: 타입 검사 + 테스트 + 프런트 빌드 검증만 한다(설치본 패키징은 release.yml → tauri-package.yml, Rust 검사는 tauri.yml).
# 잡 이름(name)이 main 룰셋의 필수 상태 체크 이름이다 — 바꾸면 룰셋도 함께 고칠 것(바꾸면 PR 머지가 막힌다).
# 내용은 Electron 을 지운 뒤에도 같은 이름을 유지한다: 'Typecheck · Test · Build' 는 renderer·shared·scripts 의 타입 검사·vitest·vite 빌드다.
on:
  pull_request:
    branches: [main]

# 같은 PR 에 새 푸시가 오면 진행 중인 이전 실행을 취소한다
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Node 설정
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # TS 골든 생성기(tests/golden*.test.ts)는 Electron 판과 함께 지워졌다 — 골든 JSON 은 동결 자산이라 Node 의 Unicode 판에 묶이지 않는다
          node-version: "22"
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      # 테스트는 git 저장소를 임시로 만들어 쓰므로 커밋 작성자를 정해 둔다
      - name: 테스트 (vitest)
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: pnpm test

      - name: 빌드 검증 (vite build — Tauri 프런트)
        run: pnpm build

      - name: WCAG 대비 검사
        run: node scripts/check-contrast.mjs
