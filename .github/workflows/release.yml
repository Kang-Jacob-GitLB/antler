name: release

# 세 OS 설치본을 빌드해 GitHub Release 에 첨부한다. 세 가지로 실행된다:
#   1) 사람이 semver 태그(v0.1.0, 프리릴리스 v0.2.0-rc.1)를 push — 태그가 이미 있고, 노트는 그 태그 메시지
#   2) nightly-release.yml 이 재사용 워크플로로 호출(workflow_call) — 버전·대상 커밋·노트를 입력으로 받고,
#      세 OS 빌드가 모두 성공한 뒤 발행 잡에서 annotated 태그를 만든다(빌드가 실패하면 태그도 남지 않는다)
#   3) 수동 실행(workflow_dispatch) — 태그 없이 설치본만 빌드해 아티팩트로 올린다(점검용, 발행하지 않음)
# 버전의 기준은 태그 하나다: 저장소의 package.json 은 0.0.0 으로 고정하고, 빌드 직전에 버전을 넣는다(커밋하지 않음).
# 주의: tags 필터는 정규식이 아니라 glob 이다.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "릴리스할 버전(접두사 v 없이, 예: 1.1.0)"
        type: string
        required: true
      sha:
        description: "빌드·태그할 커밋"
        type: string
        required: true
      notes:
        description: "릴리스 노트(마크다운, 첫 줄은 태그 제목)"
        type: string
        required: true

permissions:
  contents: read # 쓰기 권한은 Release 를 만드는 release 잡에만 준다

jobs:
  # ── OS별 설치본 빌드 ─────────────────────────────────────────────────
  # 각 러너에서 electron-builder 로 그 OS 설치본을 만들어 워크플로 아티팩트로 올린다.
  # 실제 Release 발행은 아래 release 잡이 셋을 모아 한 번에 한다(같은 태그에 동시 발행하는 레이스 방지).
  # 설치본 외에 앱 안 업데이트용 메타데이터(dist/latest*.yml: 버전·sha512)와 blockmap(차등 다운로드)도 함께 올린다.
  #   electron-builder.yml 의 publish 설정 덕분에 --publish never 여도 생성된다.
  # 타깃은 electron-builder.yml 을 따른다:
  #   Windows — NSIS 설치 프로그램 + portable (x64)
  #   macOS   — dmg (arm64, x64 — arm64 러너에서 둘 다 빌드), ad-hoc 서명
  #   Linux   — AppImage + deb (x64, Ubuntu)
  build:
    name: 빌드 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 한 OS 가 실패해도 나머지는 끝까지 돌려 원인 파악을 쉽게 한다(release 는 needs 라 발행되지 않는다)
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: win
            eb_platform: "--win"
            meta_file: dist/latest.yml
            installer_glob: |
              dist/*.exe
              dist/latest.yml
              dist/*.blockmap
          - os: macos-latest
            asset: mac
            eb_platform: "--mac"
            meta_file: dist/latest-mac.yml
            installer_glob: |
              dist/*.dmg
              dist/latest-mac.yml
              dist/*.blockmap
          - os: ubuntu-latest
            asset: linux
            eb_platform: "--linux"
            meta_file: dist/latest-linux.yml
            installer_glob: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
              dist/*.blockmap

    # Windows 도 Git Bash 로 고정해 셸 차이를 없앤다
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 재사용 호출이면 계산한 그 커밋을, 아니면 이 실행의 ref(태그 등)를 빌드한다
          ref: ${{ inputs.sha || github.ref }}
          persist-credentials: false

      # 버전을 package.json 에 넣는다(이 러너 안에서만, 커밋하지 않음).
      # electron-builder(설치본 이름·latest*.yml)와 앱의 __APP_VERSION__(electron.vite.config.mts)이 모두 이 값을 읽는다.
      # 재사용 호출은 입력 버전, 태그 push 는 태그 버전, 수동 실행은 0.0.0-ci.<실행 번호>.
      - name: 버전 결정 → package.json
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci.${{ github.run_number }}"
          fi
          # semver(MAJOR.MINOR.PATCH[-pre]) 가 아니면 실패한다 — 설치본 이름·업데이트 비교가 이 값에 기대므로
          if ! echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::semver 가 아닌 버전입니다: $VERSION ($GITHUB_REF_NAME)"
            exit 1
          fi
          npm pkg set version="$VERSION"
          echo "버전=$VERSION"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Node 설정
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 빌드 (electron-vite)
        run: pnpm build

      # --publish never: 태그 트리거 + 토큰이 있는 상태에서 electron-builder 가 스스로 Release 를 만들어
      #   아래 release 잡과 충돌하는 것을 막는다.
      # 코드 서명: Windows 는 인증서가 없어 미서명, macOS 는 electron-builder.yml 의 ad-hoc('-') 서명.
      #   CSC_IDENTITY_AUTO_DISCOVERY=false 로 러너 키체인의 인증서를 집어 쓰지 않게 한다.
      - name: 패키징 (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.eb_platform }} --publish never

      # 앱 안 업데이트가 읽는 메타데이터(버전·sha512)가 없으면 이 잡에서 바로 실패한다(수동 dry run 도 잡아낸다)
      - name: 업데이트 메타데이터 확인
        run: |
          ls -la dist
          test -f "${{ matrix.meta_file }}" || { echo "::error::${{ matrix.meta_file }} 가 없습니다"; exit 1; }

      - name: 설치본 아티팩트 업로드
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.asset }}
          path: ${{ matrix.installer_glob }}
          if-no-files-found: error

  # ── 릴리스 발행: 세 OS 설치본을 모아 한 번에 Release 생성·첨부 ──────────
  release:
    name: 릴리스 발행
    needs: build # 세 OS 빌드가 모두 성공해야 발행(반쪽짜리 릴리스 방지)
    # 태그 push 이거나 재사용 호출일 때만 발행한다(수동 실행은 빌드 점검만)
    if: github.ref_type == 'tag' || inputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 발행할 태그 이름: 재사용 호출이면 v<입력 버전>, 태그 push 면 그 태그
      TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || github.ref }}
          fetch-depth: 0
          # 재사용 호출만 태그를 push 해야 해서 자격 증명이 필요하다
          persist-credentials: ${{ inputs.version && 'true' || 'false' }}

      - name: 설치본 아티팩트 다운로드
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: 첨부할 설치본 목록
        run: ls -la installers

      # 재사용 호출: 빌드가 모두 성공한 지금에서야 annotated 태그를 만든다(노트 = 태그 메시지).
      # 노트는 커밋 제목에서 만든 문자열이라 셸에 직접 끼워 넣지 않고 환경 변수로 넘긴다.
      - name: 태그 만들기·push (재사용 호출)
        if: inputs.version
        env:
          NOTES: ${{ inputs.notes }}
          SHA: ${{ inputs.sha }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG 태그가 이미 있습니다"
            exit 1
          fi
          printf '%s\n' "$NOTES" > tag_message.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 기본 cleanup(strip)은 '#' 으로 시작하는 줄을 주석으로 지워 노트의 '## 새 기능' 같은 제목이 사라진다
          git tag -a --cleanup=verbatim "$TAG" -F tag_message.md "$SHA"
          git push origin "refs/tags/$TAG"

      # 릴리스 노트: annotated 태그 메시지. 없으면 GitHub 자동 생성 노트로 대신한다
      - name: 릴리스 노트 추출
        id: notes
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          : > release_notes.md
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" > release_notes.md
          fi
          if [ -s release_notes.md ]; then
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 릴리스 생성 + 설치본 첨부 (Windows / macOS / Ubuntu)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release_notes.md
          generate_release_notes: ${{ steps.notes.outputs.fallback == 'true' }}
          # 하이픈이 든 태그(v0.2.0-rc.1)는 프리릴리스로 표시
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            installers/*
