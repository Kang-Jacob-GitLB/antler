name: tauri

# Tauri 이관(docs/tauri.md)의 Rust 쪽 검사: 이식한 파서·실행기·라우터가 TS 골든과 같은 결과를 내는지(cargo test) + clippy.
# 배포 빌드는 하지 않는다.
#
# 필수 상태 체크로 쓸 수 있게 **모든 PR 에서 돌고 항상 결과를 보고한다**. 워크플로 수준의 paths 필터를 쓰면 관련 없는 PR 에서는
# 체크가 아예 보고되지 않아, 필수로 지정했을 때 그 PR 이 영원히 대기한다. 대신 첫 단계가 바뀐 파일을 보고 관련이 없으면
# 무거운 단계를 건너뛰고 성공으로 끝낸다(목록은 아래 RELEVANT).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust · 골든 · clippy
    runs-on: windows-latest
    # 평소 3~5분. 러너가 멈춰도 한 시간씩 붙잡히지 않게 끊는다
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # PR 의 기준 커밋과 비교하려면 이력이 필요하다(저장소가 작아 전체를 받는다)
          fetch-depth: 0

      # 바뀐 파일 중 Rust 검사와 관련 있는 것이 있는지. workflow_dispatch 는 항상 돈다
      - name: 관련 변경 확인
        id: changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # Rust 이식의 원본(TS)·골든·fixture 와 Rust 코드
          $RELEVANT = @(
            '^src-tauri/', '^tests/golden/', '^tests/fixtures/', '^src/main/git/', '^src/main/executors/',
            '^src/main/services/RepoService\.ts$', '^src/main/services/ConfigStore\.ts$', '^src/main/windowState\.ts$','^src/main/ipc/handlers\.ts$',
            '^scripts/make-repo-fixtures\.mjs$', '^scripts/make-edge-fixtures\.mjs$', '^scripts/lib/edgeFixtures6a\.mjs$', '^src/shared/', '^src/sidecar/',
            '^src/renderer/tauri/', '^tests/golden.*\.test\.ts$', '^\.github/workflows/tauri\.yml$',
            '^src/main/ipc/confirmText\.ts$', '^src/main/ipc/jira\.ts$', '^src/main/ipc/github\.ts$', '^scripts/gen-fetch-special\.mjs$', '^src/main/github/', '^src/main/jira/',
            '^src/main/update/', '^tests/update\.test\.ts$',
            '^scripts/make-update-manifests\.mjs$', '^scripts/check-release-features\.mjs$'
          )
          if ($env:EVENT -ne 'pull_request') { "run=true" >> $env:GITHUB_OUTPUT; exit 0 }
          $files = git diff --name-only "$env:BASE_SHA" HEAD
          if ($LASTEXITCODE -ne 0) { Write-Host '비교 실패 — 안전하게 전부 돈다'; "run=true" >> $env:GITHUB_OUTPUT; exit 0 }
          $hit = $files | Where-Object { $f = $_; $RELEVANT | Where-Object { $f -match $_ } }
          if ($hit) {
            Write-Host "관련 변경:"; $hit | ForEach-Object { Write-Host "  $_" }
            "run=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host '관련 변경 없음 — Rust 검사를 건너뛰고 성공으로 보고한다'
            "run=false" >> $env:GITHUB_OUTPUT
          }

      # 러너에 기본 설치된 rustup 을 쓴다(서드파티 액션을 늘리지 않는다)
      - name: Rust stable
        if: steps.changes.outputs.run == 'true'
        run: |
          rustup default stable
          rustup component add clippy
          rustc --version

      # 컴파일은 frontendDist(out-tauri/renderer)가 없어도 된다 — 필요해지면 여기서 빈 폴더를 만든다
      # exec: 실제 git 을 띄우는 실행기 테스트(러너의 Git for Windows 를 쓴다). 러너에는 WSL 배포판이 없어 WSL 통합 케이스는 건너뛴다
      # (`[wsl] 건너뜀` 이 출력된다). git 격리는 tests/exec.rs 의 isolate(ctor)가 한다
      # channels: 라우터의 Rust 경로(git:commit)가 TS 골든과 같은 결과를 내는지(fixture 는 git fast-import 로 만든다)
      # fetch_guard: fetch 가드 판정 로직(허용 목록·URL·확인 창 표시·오류 분류)이 tests/golden/fetch 골든과 같은지(git 을 실행하지 않는다)
      # fetch: fetch 실행(inspect_config·run_fetch)의 실제 git 통합 테스트 — 루프백(127.0.0.1) 가짜 서버만 쓰고 WSL 케이스는 배포판이 없으면 건너뛴다.
      # tests/fetch.test.ts 의 각 it 이 어느 Rust 테스트로 옮겨졌는지는 tests/golden/fetch/test-map.json(vitest 가 누락을 강제)
      # fetch_service: fetch 상태 기계(주기·백오프·승인 저장 프로토콜). fetch_route: git:fetch 라우팅·소유권·앱 배선 순서·승인 경로의 소스 검사(git 을 띄우지 않는다)
      # api_route: jira:*·gh:* 라우팅(스위치 ANTLER_RUST_GIT·하위 스위치 은퇴·서비스/키체인 생성 위치·사이드카 env·토큰 줄 없음·열기 경로의 소스 검사). 네트워크를 쓰지 않는다.
      # app_route: 앱 채널 4개(dialog:pickFolder·clipboard:writeText·code:openLink·win:setTitleBarTheme)의 라우팅·검증. 대화상자·클립보드·브라우저는 가짜 포트다(실제 창·사용자 클립보드를 쓰지 않는다)
      # channels 는 test-hooks 가 켜져 있으면 jira:*·gh:* 채널 골든(tests/golden/channels/jira.json·github.json — 127.0.0.1 목 서버)도 돈다
      # lib 에는 repoq(옛 Rust→Node 질의 메시지 — PR 10 이 지운다)·local_time(한도 해제 시각)·config(sync·import)·fetch_host(승인·기본 브랜치 쓰기) 단위 테스트가 있다
      # net: GitHub·Jira 순수 로직(검증·URL 판정·응답 해석·Device Flow·ghEnv·토큰 가리기)이 tests/golden/net 골든과 같은지 + Rust 허용 ⇒ TS 허용 위반 0(네트워크·git 을 쓰지 않는다).
      # TS 테스트 대응표는 tests/golden/net/test-map.json(vitest 가 누락을 강제)
      # net 은 가짜 gh 도 띄운다(gh_cli_run): 테스트 바이너리를 gh.exe 로 하드링크해 gh CLI 토큰 가져오기(Job Object·제한 시간·cwd 의 gh.exe 무시)를 본다. 실제 gh 는 쓰지 않는다
      # ssh_golden: SSH 순수 로직(설정 파서·known_hosts·원격 명령 인용, Phase 5 PR 1)이 tests/golden/ssh 와 exec/env.json 의 ssh 절과 같은지(소켓·ssh·git 을 쓰지 않는다).
      # TS 테스트 대응표는 tests/golden/ssh/test-map.json(vitest 가 누락을 강제)
      # ssh: SSH 실행기(russh, Phase 5 PR 2)의 통합 테스트 — 127.0.0.1 의 프로세스 안 russh::server 만 쓴다(외부 접속·사용자의 ~/.ssh·agent 를 쓰지 않는다). 원격 git 은 LocalExecutor 로 돌린다.
      # 실제 sshd 를 쓰는 시험은 #[ignore] 라 CI 에서 돌지 않는다
      # ssh_route: ssh 저장소 라우팅(Phase 5 PR 3) — sshHost 검사·스위치·쓰지 않는 호스트의 연결 정리·앱 배선의 소스 검사. 같은 루프백 서버만 쓴다(channels 의 *_ssh_에서도_* 시험도 같다)
      # Phase 6a(나머지 git 채널): 순수 로직(코드 탐색기·LFS·gitflow·활동·기본 브랜치·WIP 경로 검증·링크 확인)은 lib 단위 테스트와 golden 바이너리가 맡는다 — 새 바이너리 없음. 코드 탐색기 4채널(PR 2)·ref 2채널(PR 3b)·검색·활동(PR 4)·LFS·gitflow 2채널(PR 5)·`gh:repo` 와 GitHub 서비스의 저장소 질의(remote 목록·push 된 커밋 — PR 8)·작업 트리 2채널(PR 6 — 악성 저장소·정션·8.3·`-c` 소스 검사 포함)은 channels(local·SSH 골든)·ssh_route 가 맡는다.
      # watch_route: 저장소 감시(Phase 6a PR 7b) — 실제 git·notify 로 외부 커밋·브랜치 알림(.git 안의 다른 변화는 무알림)·소유 판정·정지·종료 뒤 notify 스레드 0, 루프백 SSH 의 폴링·포커스(연결 하나).
      # 파일 감시 시험은 조건 + 20초 상한으로 기다린다(고정 sleep 없음). 외부 접속·사용자의 ~/.ssh 를 쓰지 않는다
      # TS 테스트 대응표는 tests/golden/channels/test-map.json(vitest tests/golden6a.test.ts 가 누락을, golden.rs 가 가리키는 fn 을 강제)
      # Phase 6b PR 1 — config: 설정 저장소 코어(ConfigStore)·GitHub 링크 순수 함수가 tests/golden/config 골든(**실제 TS ConfigStore** 를 임시 파일로 돌린 결과 — 최종 파일 바이트·던진 문구·알림 횟수)과 같은지 +
      # 알림·쓰기 실패·동시 쓰기·uuid. 임시 폴더에만 쓰고 사용자 설정·네트워크·git 을 쓰지 않는다. TS 테스트 대응표는 tests/golden/repos/test-map.json(vitest tests/goldenConfig.test.ts 가 누락을 강제)
      # external: 외부 열기(Phase 6b PR 3)의 경로 검증·실행 인자 계획·실행기·링크 허용이 tests/golden/external 골든과 같은지 + 가짜 의존성 시나리오 + 소스 검사(프로세스는 external/launch.rs 한 곳).
      # 에디터·터미널·탐색기·wsl.exe 를 띄우지 않는다. TS 테스트 대응표는 tests/golden/external/test-map.json(vitest 가 누락을 강제)
      # Phase 6b PR 2 — github_cache_exec: GitHub 원격 전용 저장소 캐시 실행 기반(닫힌 환경 GithubEnv·GitExecutor::Github·init·정확 일치 검사·HEAD 맞추기·github 모드 fetch)이 tests/golden/github 골든(TS 가 만든 판정·환경 순서·가짜 실행기의 argv)과 같은지 +
      # 실제 git(file:/// 소스 저장소만)·127.0.0.1 가짜 서버(리다이렉트를 따라가지 않음·토큰이 다른 호스트로 가지 않음)·소스 검사. github_cache_isolation: 프로세스 전역 git 설정이 적대적일 때(insteadOf·safe.bareRepository·reftable)의 격리 — 전역 설정이 다른 별도 바이너리.
      # TS 테스트 대응표는 tests/golden/repos/test-map.json(vitest tests/goldenConfig.test.ts 가 누락을 강제), 골든은 tests/goldenGithub.test.ts 가 TS 로 만든다
      # Phase 6b PR 6 — github_route: GitHub 원격 전용 저장소(github kind)의 git 조회 채널을 Rust 가 처리(스위치·서비스·캐시 실행기가 모두 있을 때만 — 아니면 사이드카)하는지 +
      # 같은 저장소의 local 결과와 같은 채널 결과·github 만의 갈래(worktrees·서브모듈·onRemote·wip·gh:repo·lenient)·repos:remove 의 진행 중 조회/로그 커서 정리(뒤이은 폴더 삭제가 한 번에 되는지)·토큰 비노출·캐시 삭제의 링크 거부.
      # 실제 git(file:/// 소스 저장소만)·127.0.0.1 의 응답 없는 서버만 쓴다(GitHub 에 닿지 않는다)
      # Phase 6b PR 7 — github_fetch: GitHub 원격 전용 저장소의 fetch·감시를 Rust 가 맡는지 — 첫 fetch·HEAD 맞추기·기본 브랜치 기록·설정 오염/레코드 불일치 차단(확인 창 없이)·401/403 인증 정지와 로그인 변경 재개·리다이렉트 거부·
      # 60분/60초 제한(멈춘 시계 + 가짜 실행기)·소유 판정이 사이드카 env 와 같은 술어인지·notify 감시·repos:remove 가 fetch·감시를 멈추고 기다린 뒤 폴더가 바로 지워지는지·토큰 비노출·소스 검사.
      # 실제 git(file:/// 소스)·127.0.0.1 가짜 HTTP 서버(상태 코드·302·무응답)만 쓴다(GitHub 에 닿지 않는다). TS 대응표의 `N/A: PR 7` 5개가 이 바이너리를 가리킨다
      # Phase 6b PR 9 — config_route: 설정 소유 채널 11개(config:*·repos:*·external:*·req:cancel)를 Rust 가 응답하는지 — 소유자가 없거나 ANTLER_RUST_GIT=0 이면 사이드카·추가/이름/그룹/삭제 시나리오의 설정 파일(키 순서까지)·
      # 미러가 응답보다 먼저 바뀌는지·SSH 승인 기억 하나(127.0.0.1 닫힌 포트)·원격 전용 저장소 추가/삭제 순서/링크 일치 검사/고아 정리/빈 캐시 복구·external:open(가짜 OpenerDeps — 프로그램을 띄우지 않는다)·소스 검사.
      # 임시 폴더·네트워크 없는 git init 만 쓴다(사용자 설정·대화상자·GitHub 에 닿지 않는다). TS 대응표의 `N/A: PR 9` 17개와 `N/A: 6b` 7개가 이 바이너리·config·external 을 가리킨다
      # Phase 6b PR 10 — sidecar_scope: Rust 가 설정을 소유한 실행에서 사이드카로 가는 채널이 update:* 7개뿐인지(IPC_CHANNELS 전수 × 인자 모양 표 — 포트가 없는 라우터 포함),
      # ANTLER_RUST_GIT=0 라우터는 전부 사이드카인지, Rust 가 풀지 못한 호출의 오류 문구가 TS RepoService 와 같은지, 없앤 사이드카 메시지의 송수신 코드가 없는지. 임시 폴더만 쓴다
      # update: 업데이트 판정 로직(Phase 6c PR 1 — semver·URL 허용 목록·매니페스트 검사·정책·오류 정화·릴리스 노트)이 tests/golden/update 골든과 같은지 + 소스 검사(logic.rs 는 입출력 없음·업데이트 모듈은 라우터·lib.rs 만 쓴다) +
      # PR 4: 서비스 상태 순서가 TS UpdateService 와 같은지(tests/golden/update/scenarios.json — 같은 입력 tests/fixtures/update.scenarios.json)·시계(10초·6시간)·릴리스 노트 캐시·update:* 7채널의 라우팅(서비스가 없거나 스위치가 꺼지면 사이드카).
      # 네트워크를 쓰지 않는다. TS 테스트 대응표는 tests/golden/update/test-map.json(vitest 가 누락을 강제)
      # update_security: 앱 업데이트 보안(Phase 6c PR 4) — 127.0.0.1 서버만 쓴다. 리다이렉트 허용 목록(밖·http·포트·사용자 정보·6단)·다른 저장소/태그 매니페스트·크기 상한·읽기 정지·
      # 시험 키로 서명한 가짜 바이트(변조·다른 키·서명된 버전 불일치·버전 없음)에서 설치 포트가 불리지 않음·키 없음 fail-closed·NSIS 표식 없으면 확인 0회·소스 검사(건너뛴 버전 쓰기 한 곳·capability·플러그인은 복원/검증/설치만).
      # 진짜 플러그인 검증은 가짜 앱(tauri::test)에 달아 돈다 — Windows 는 시험 실행 파일에 Common Controls v6 매니페스트가 필요해 build.rs 가 넣는다. 설치 프로그램을 띄우지 않는다
      - name: 테스트 (단위 + TS 골든 패리티 + 실행기 + 채널)
        if: steps.changes.outputs.run == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --features test-hooks --lib --test golden --test exec --test channels --test log --test fetch_guard --test fetch --test fetch_service --test fetch_route --test api_route --test app_route --test net --test ssh_golden --test ssh --test ssh_route --test config --test external --test watch_route --test update --test update_security --test single_instance --test env_route --test github_cache_exec --test github_cache_isolation --test github_cache_env --test github_route --test github_cache_pin --test github_fetch --test config_route --test sidecar_scope

      # test-hooks(HTTP 테스트 훅, docs/tauri.md): feature 없는 빌드가 운영 모양이다 — 둘 다 돌린다
      - name: clippy
        if: steps.changes.outputs.run == 'true'
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features test-hooks -- -D warnings
