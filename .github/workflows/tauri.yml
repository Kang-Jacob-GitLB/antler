name: tauri

# Tauri 이관(docs/tauri.md)의 Rust 쪽 검사: 이식한 파서·실행기가 TS 골든과 같은 결과를 내는지(cargo test) + clippy.
# 필수 상태 체크가 아니다(main 룰셋은 build.yml 의 잡만 요구한다). 배포 빌드는 하지 않는다.
on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "tests/golden/**"
      - "tests/fixtures/**"
      - "src/main/git/**"
      - "src/main/executors/**"
      - "src/main/services/RepoService.ts"
      - "src/main/services/ConfigStore.ts"
      # Rust 의 check_path·wsl 경로 변환이 따라야 하는 TS 원본
      - "src/main/ipc/handlers.ts"
      - "src/main/executors/wslPaths.ts"
      - "scripts/make-repo-fixtures.mjs"
      - "src/shared/**"
      - "src/sidecar/**"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust · 골든 · clippy
    runs-on: windows-latest
    # 평소 3~5분. 러너가 멈춰도 한 시간씩 붙잡히지 않게 끊는다
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 러너에 기본 설치된 rustup 을 쓴다(서드파티 액션을 늘리지 않는다)
      - name: Rust stable
        run: |
          rustup default stable
          rustup component add clippy
          rustc --version

      # 컴파일은 frontendDist(out-tauri/renderer)가 없어도 된다 — 필요해지면 여기서 빈 폴더를 만든다
      # exec: 실제 git 을 띄우는 실행기 테스트(러너의 Git for Windows 를 쓴다). 러너에는 WSL 배포판이 없어 WSL 통합 케이스는 건너뛴다
      # (`[wsl] 건너뜀` 이 출력된다). git 격리는 tests/exec.rs 의 isolate(ctor)가 한다
      # channels: 라우터의 Rust 경로(git:commit)가 TS 골든과 같은 결과를 내는지(fixture 는 git fast-import 로 만든다)
      - name: 테스트 (단위 + TS 골든 패리티 + 실행기 + 채널)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --test golden --test exec --test channels

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
