[package]
name = "antler"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "antler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 사이드카 응답 대기표(id → oneshot) + git 실행기(process·io-util: 자식 파이프, time: 테스트·유휴 정리, macros: select!/test)
tokio = { version = "1", features = ["sync", "process", "io-util", "time", "macros", "rt", "rt-multi-thread", "net"] }
# 취소 신호(CancellationToken) — 실행기·큐가 요청 취소를 받는다. tauri 가 이미 끌어오는 판(0.7)
tokio-util = "0.7"
# ProcessQueue 의 같은 키 요청 합치기(Shared)·Boxed future. tauri 가 이미 쓰는 판(0.3)
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# host 요청(openExternal·clipboard·대화상자)을 Rust API 로 처리한다. JS 쪽 권한은 capabilities 에 주지 않는다
tauri-plugin-opener = "2.7.3"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-window-state = "2.5.0"
# 단일 인스턴스(src/single_instance.rs, Phase 6c PR 3). 2.5.5 는 tauri "2.12" 를 요구하는 최신 안정판. 새 크레이트 목록은 docs/tauri.md. 반드시 첫 플러그인으로 등록한다
tauri-plugin-single-instance = "2.5.5"
# fetch 가드의 위험 항목 지문(sha256) — Cargo.lock 에 전이 의존으로 이미 있는 판(0.10)
sha2 = "0.10"
# 해시된 known_hosts 항목(`|1|salt|hash`, HMAC-SHA1)의 검사(src/git/exec/ssh/known_hosts.rs). RustCrypto 0.10 계열이라 위 sha2 와 digest·crypto-common 이 같은 판이다
hmac = "0.12"
sha1 = "0.10"
# GitHub·Jira 순수 판정(src/net, src/github, src/jira)의 URL 해석(WHATWG — Node 의 `new URL` 과 같은 규칙)과 base64(Authorization·토큰 가림).
# 둘 다 Cargo.lock 에 전이 의존으로 이미 있는 판이다.
url = "2"
base64 = "0.23"
# GitHub·Jira HTTP 클라이언트(PR 3). TLS 는 OS 의 것(Windows: SChannel·인증서 저장소)이라 rustls·ring 이 들어오지 않는다.
# 클라이언트는 src/net/http.rs 한 곳에서만 만든다(clippy.toml 이 `Client::new` 등을 막는다)
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# 토큰이 든 버퍼·문자열을 버릴 때 0 으로 덮는다(SecretString·secret 모듈). keyring 이 이미 끌어오는 판(1)이다
zeroize = "1"
# SSH 실행기(src/git/exec/ssh/connection.rs, Phase 5 PR 2). ring 백엔드(aws-lc 는 C 툴체인이 더 필요하다)·rsa 키·pageant 클라이언트(항상 포함).
# 연결·인증 API 는 connection.rs 한 곳에서만 부른다(clippy.toml 의 disallowed-methods)
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
# 저장소 감시의 이벤트원(src/git/fs_watch.rs, Phase 6a PR 7b). Windows: ReadDirectoryChangesW 재귀, Linux: inotify. 8.2 안정판(9.0 은 프리릴리스라 쓰지 않는다).
# default-features 를 끄면 macOS 백엔드(`macos_fsevent`)가 빠진다. macOS 는 `macos_fsevent`(기본)나 `macos_kqueue` 중 하나가 있어야 RecommendedWatcher 가 정해진다(notify lib.rs 의 cfg) —
# 지금은 macOS 빌드를 하지 않으며(Phase 6c) 그때 `macos_fsevent` 를 켠다
notify = { version = "8.2.2", default-features = false }
# SFTP 폴더 목록(src/git/exec/ssh/sftp.rs, Phase 6b PR 4b, 결정 D4). 클라이언트는 AsyncRead+AsyncWrite 스트림만 받는다(russh 에 의존하지 않는다 — russh 0.65.2 채널과 맞물리는지는 tests/ssh.rs 의 시험이 확인한다)
russh-sftp = "3.0.1"

# 설정 저장소(src/config)의 저장소 id — TS 의 `randomUUID()` 와 같은 v4. Cargo.lock 에 전이 의존으로 이미 있는 판(1.29)이고 난수원(getrandom)도 이미 있다
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
# 실행기 통합 테스트(tests/exec.rs)가 어떤 테스트보다 먼저 git 설정 격리 환경을 넣는다. tauri 가 이미 끌어오는 판
ctor = "1.0.13"
# fetch 통합 테스트(tests/fetch.rs)의 루프백(127.0.0.1) 가짜 서버: 401 NTLM/Negotiate 챌린지·번들 호스트. 제품 코드는 네트워크를 열지 않는다
# test-util: fetch 상태 기계(service.rs)의 주기·백오프·60초 제한을 멈춘 시계(start_paused)로 검증한다
tokio = { version = "1", features = ["net", "test-util"] }
# tests/net.rs 의 자체 서명 인증서 TLS 목 서버(운영 클라이언트가 핸드셰이크에서 실패하는지)와 검증을 끈 대조 클라이언트. reqwest 가 이미 끌어오는 판(0.2)이라 새 크레이트가 아니다
native-tls = "0.2"
# tests/ssh.rs 의 테스트 서버 키 생성(russh 의 예제와 같은 난수원). russh 가 이미 끌어오는 판이라 새 크레이트가 아니다
rand = "0.10"

[target.'cfg(windows)'.dependencies]
# 스냅 레이아웃(Win+Z) 키 입력 — tauri 가 이미 쓰는 windows 0.62 와 같은 판
# Job Object(프로세스 트리 종료, src/git/exec/job.rs)에 JobObjects 가, CreateJobObjectW 의 인자 타입에 Security 가 필요하다
# Time: GitHub 한도 해제 시각을 로컬 시간대로 표시한다(src/github/local_time.rs — SystemTimeToTzSpecificLocalTime). 새 크레이트가 아니라 같은 크레이트의 기능이다
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Time", "Win32_System_WindowsProgramming", "Win32_System_Registry"] }
# (위 windows) Win32_System_Registry: WSL 등록 배포판 조회(src/git/exec/wsl.rs — HKCU\...\Lxss 읽기). reg.exe 를 띄우지 않으려는 것이고, 새 크레이트가 아니라 같은 크레이트의 기능이다
# (위 windows) Win32_System_WindowsProgramming: SSH 설정 해석의 로컬 사용자 이름(src/git/exec/ssh/config.rs — GetUserNameW). 새 크레이트가 아니라 같은 크레이트의 기능이다
# 확인 창을 플러그인 없이 직접 띄운다 — 플러그인은 Esc 를 "cancel 자리 버튼"으로 바꿔 돌려줘 취소를 기본 버튼으로 둘 수 없다
# (src-tauri/src/dialogs.rs). tauri-plugin-dialog 2.8 이 쓰는 것과 같은 판·기능이라 따로 빌드되지 않는다
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
# 토큰 보관(src/secret) — Windows 자격 증명 관리자. 키링 생성은 secret 모듈 한 곳에서만 한다(tests/net.rs 의 소스 검사)
keyring-core = "1"
windows-native-keyring-store = "1.1"

[features]
cdp = []
# HTTP 테스트 훅(`Profile::Test`·`Rewrite`·net/github/jira 의 `*_for_test`·`SiteOptions::insecure_loopback_for_test`): 루프백 http 허용·짧은 제한 시간·주소 치환.
# 운영 빌드에는 없다 — tests/net.rs 는 이 feature 가 있어야 빌드된다(`cargo test --features test-hooks`)
test-hooks = []

[[test]]
name = "net"
required-features = ["test-hooks"]

[[test]]
name = "config"
required-features = ["test-hooks"]

# GitHub 캐시 실행 기반(Phase 6b PR 2): 원격 URL·프로토콜 주입(`*_for_test`·`with_protocol_for_test`)이 test-hooks 뒤에 있다
[[test]]
name = "github_cache_exec"
required-features = ["test-hooks"]

[[test]]
name = "github_cache_isolation"
required-features = ["test-hooks"]

[[test]]
name = "github_cache_env"
required-features = ["test-hooks"]
