# 자식 프로세스는 src/git/exec 의 실행기만 띄운다 — 환경변수·인자·창 숨김·트리 종료 규칙이 한 곳에 있어야
# 악성 저장소 방어(GIT_ENV·전역 인자)를 빠뜨린 호출이 생기지 않는다. 꼭 필요한 곳은 `#[allow(clippy::disallowed_methods)]` 와 이유를 단다.
disallowed-methods = [
  { path = "std::process::Command::new", reason = "git 은 git::exec 의 실행기로만 띄운다(예외는 allow 와 이유 주석)" },
  { path = "tokio::process::Command::new", reason = "git 은 git::exec 의 실행기로만 띄운다(예외는 allow 와 이유 주석)" },
]
# windows 크레이트의 CreateProcessW/A 는 지금 켠 기능(Win32_System_Threading)만으로는 노출되지 않아(Win32_Security 필요) 부를 수 없다.
# 그 기능을 켜게 되면 여기 disallowed-methods 에 두 경로를 추가한다(지금 넣으면 "도달할 수 없는 함수" 경고가 난다).
