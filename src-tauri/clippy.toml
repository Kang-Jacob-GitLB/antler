# 자식 프로세스는 src/git/exec 의 실행기만 띄운다 — 환경변수·인자·창 숨김·트리 종료 규칙이 한 곳에 있어야
# 악성 저장소 방어(GIT_ENV·전역 인자)를 빠뜨린 호출이 생기지 않는다. 꼭 필요한 곳은 `#[allow(clippy::disallowed_methods)]` 와 이유를 단다.
disallowed-methods = [
  { path = "std::process::Command::new", reason = "git 은 git::exec 의 실행기로만 띄운다(예외는 allow 와 이유 주석)" },
  { path = "tokio::process::Command::new", reason = "git 은 git::exec 의 실행기로만 띄운다(예외는 allow 와 이유 주석)" },
  # Win32_Security 를 켜서 windows 크레이트의 CreateProcess 가 노출된다 — 같은 규칙을 우회하지 못하게 막는다
  { path = "windows::Win32::System::Threading::CreateProcessW", reason = "프로세스는 git::exec 의 실행기로만 띄운다" },
  { path = "windows::Win32::System::Threading::CreateProcessA", reason = "프로세스는 git::exec 의 실행기로만 띄운다" },
  # 같은 기능(또는 기능 조건 없이)으로 노출되는 다른 프로세스 생성 함수들
  { path = "windows::Win32::System::Threading::CreateProcessAsUserW", reason = "프로세스는 git::exec 의 실행기로만 띄운다" },
  { path = "windows::Win32::System::Threading::CreateProcessAsUserA", reason = "프로세스는 git::exec 의 실행기로만 띄운다" },
  { path = "windows::Win32::System::Threading::CreateProcessWithLogonW", reason = "프로세스는 git::exec 의 실행기로만 띄운다" },
  { path = "windows::Win32::System::Threading::CreateProcessWithTokenW", reason = "프로세스는 git::exec 의 실행기로만 띄운다" },
  { path = "windows::Win32::System::Threading::WinExec", reason = "프로세스는 git::exec 의 실행기로만 띄운다" },
  # HTTP 클라이언트는 net::http 한 곳에서만 만든다 — https 전용·프록시 무시·15초·리다이렉트 정책을 빠뜨린 클라이언트가 생기지 않게 한다
  { path = "reqwest::Client::new", reason = "HTTP 클라이언트는 net::http 에서만 만든다" },
  { path = "reqwest::Client::builder", reason = "HTTP 클라이언트는 net::http 에서만 만든다" },
  { path = "reqwest::ClientBuilder::new", reason = "HTTP 클라이언트는 net::http 에서만 만든다" },
  { path = "reqwest::get", reason = "HTTP 클라이언트는 net::http 에서만 만든다" },
  # `Client::default`·`ClientBuilder::default` 는 트레이트 구현이라 clippy 가 경로로 찾지 못한다("does not refer to a reachable function").
  # 대신 tests/net.rs 의 소스 검사가 net/http.rs 밖의 `Client`·`ClientBuilder` 이름을 막는다
  { path = "reqwest::ClientBuilder::danger_accept_invalid_certs", reason = "인증서 검증을 끄지 않는다" },
  { path = "reqwest::ClientBuilder::danger_accept_invalid_hostnames", reason = "호스트 이름 검증을 끄지 않는다" },
  # reqwest 0.13 의 실제 이름(위 두 줄은 이전 이름이라 0.13 에서는 아무것도 막지 못한다)
  { path = "reqwest::ClientBuilder::tls_danger_accept_invalid_certs", reason = "인증서 검증을 끄지 않는다" },
  { path = "reqwest::ClientBuilder::tls_danger_accept_invalid_hostnames", reason = "호스트 이름 검증을 끄지 않는다" },
  # SSH(src/git/exec/ssh): 연결·인증·포워딩 API 는 connection.rs·auth.rs 한 곳에서만, 허용된 것만 쓴다 — 호스트 키 검증(TOFU 없음)·인증 수단(키·agent 뿐)·
  # 원격 명령(build_remote_command 만)을 우회하는 호출이 생기지 않게 한다. connection.rs 의 connect_stream·channel_open_direct_tcpip(ProxyJump)·Channel::exec(프로브·open_exec(run·stream 공용)) 만
  # `#[allow(clippy::disallowed_methods)]` 와 이유를 단다. 시험 서버·날 클라이언트(tests/ssh/)는 같은 방식으로 allow 한다
  { path = "russh::client::connect", reason = "SSH 연결은 ssh/connection.rs 에서만 맺는다(호스트 키 검증·시간 제한·방어)" },
  { path = "russh::client::connect_stream", reason = "SSH 연결은 ssh/connection.rs 에서만 맺는다(호스트 키 검증·시간 제한·방어)" },
  { path = "russh::client::Handle::authenticate_password", reason = "비밀번호 인증은 쓰지 않는다(키·agent 뿐)" },
  { path = "russh::client::Handle::authenticate_keyboard_interactive_start", reason = "keyboard-interactive 인증은 쓰지 않는다(키·agent 뿐)" },
  { path = "russh::client::Handle::authenticate_keyboard_interactive_respond", reason = "keyboard-interactive 인증은 쓰지 않는다(키·agent 뿐)" },
  { path = "russh::client::Handle::authenticate_gssapi_with_mic", reason = "GSSAPI 인증은 쓰지 않는다(키·agent 뿐)" },
  # known_hosts 는 우리 쪽 검증(verify_host_key_text)만 쓴다 — russh 의 함수는 사용자 홈의 파일을 읽고 learn 은 파일에 **쓴다**(TOFU)
  { path = "russh::keys::known_hosts::learn_known_hosts", reason = "known_hosts 에 쓰지 않는다(TOFU 없음)" },
  { path = "russh::keys::known_hosts::learn_known_hosts_path", reason = "known_hosts 에 쓰지 않는다(TOFU 없음)" },
  { path = "russh::keys::known_hosts::check_known_hosts", reason = "호스트 키는 ssh/known_hosts.rs 의 판정만 쓴다" },
  { path = "russh::keys::known_hosts::check_known_hosts_path", reason = "호스트 키는 ssh/known_hosts.rs 의 판정만 쓴다" },
  # 포워딩·agent 전달·X11 요청 금지(클라이언트 쪽 요청 API)
  { path = "russh::client::Handle::tcpip_forward", reason = "원격 포트 포워딩을 요청하지 않는다" },
  { path = "russh::client::Handle::cancel_tcpip_forward", reason = "포트 포워딩을 쓰지 않는다" },
  { path = "russh::client::Handle::streamlocal_forward", reason = "소켓 포워딩을 요청하지 않는다" },
  { path = "russh::client::Handle::cancel_streamlocal_forward", reason = "소켓 포워딩을 쓰지 않는다" },
  { path = "russh::client::Handle::channel_open_direct_tcpip", reason = "direct-tcpip 는 ProxyJump(ssh/connection.rs)에서만 연다" },
  { path = "russh::client::Handle::channel_open_direct_streamlocal", reason = "소켓 포워딩을 쓰지 않는다" },
  { path = "russh::client::Handle::channel_open_x11", reason = "X11 을 쓰지 않는다" },
  { path = "russh::channels::Channel::agent_forward", reason = "agent 전달을 요청하지 않는다" },
  { path = "russh::channels::Channel::request_x11", reason = "X11 전달을 요청하지 않는다" },
  { path = "russh::channels::ChannelWriteHalf::agent_forward", reason = "agent 전달을 요청하지 않는다" },
  { path = "russh::channels::ChannelWriteHalf::request_x11", reason = "X11 전달을 요청하지 않는다" },
  { path = "russh::client::Handle::send_global_request", reason = "전역 요청(포워딩 등)을 직접 보내지 않는다" },
  # 핸들러 안에서 쓰는 `client::Session` 쪽 같은 API 도 막는다(Handle 만 막으면 이쪽으로 우회된다)
  { path = "russh::client::Session::tcpip_forward", reason = "원격 포트 포워딩을 요청하지 않는다" },
  { path = "russh::client::Session::streamlocal_forward", reason = "소켓 포워딩을 요청하지 않는다" },
  { path = "russh::client::Session::agent_forward", reason = "agent 전달을 요청하지 않는다" },
  { path = "russh::client::Session::request_x11", reason = "X11 전달을 요청하지 않는다" },
  { path = "russh::client::Session::channel_open_x11", reason = "X11 을 쓰지 않는다" },
  { path = "russh::client::Session::channel_open_direct_tcpip", reason = "direct-tcpip 는 ProxyJump(ssh/connection.rs)에서만 연다" },
  { path = "russh::client::Session::channel_open_direct_streamlocal", reason = "소켓 포워딩을 쓰지 않는다" },
  { path = "russh::client::Session::send_global_request", reason = "전역 요청(포워딩 등)을 직접 보내지 않는다" },
  # 채널 요청: 원격 명령은 exec 한 곳(connection.rs 의 프로브·open_exec(run·stream 공용))에서만 보낸다. 셸·환경변수 주입은 쓰지 않는다
  { path = "russh::channels::Channel::exec", reason = "원격 명령 실행은 ssh/connection.rs 의 프로브·open_exec(run·stream 공용) 에서만 요청한다" },
  { path = "russh::channels::Channel::request_shell", reason = "대화형 셸을 요청하지 않는다" },
  { path = "russh::channels::Channel::set_env", reason = "원격 환경변수를 주입하지 않는다(build_remote_command 의 env 만)" },
  { path = "russh::channels::ChannelWriteHalf::exec", reason = "원격 명령 실행은 ssh/connection.rs 의 프로브·open_exec(run·stream 공용) 에서만 요청한다" },
  { path = "russh::channels::ChannelWriteHalf::request_shell", reason = "대화형 셸을 요청하지 않는다" },
  { path = "russh::channels::ChannelWriteHalf::set_env", reason = "원격 환경변수를 주입하지 않는다(build_remote_command 의 env 만)" },
]
